<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="700" height="260" viewBox="0 0 700 260">
  <style> .c{fill:none;stroke:#222;stroke-width:2} .t{font:12px sans-serif;fill:#000} .p{fill:#eee;stroke:#444} </style>
  <!-- Master pot -->
  <rect x="20" y="30" width="120" height="48" class="p"/>
  <text x="34" y="58" class="t">VR6 (Master)</text>
  <!-- Per-band pots -->
  <rect x="180" y="20" width="120" height="48" class="p"/>
  <text x="194" y="48" class="t">VR3 (High)</text>
  <rect x="320" y="20" width="120" height="48" class="p"/>
  <text x="334" y="48" class="t">VR4 (Mid)</text>
  <rect x="460" y="20" width="120" height="48" class="p"/>
  <text x="474" y="48" class="t">VR5 (Low)</text>

  <!-- Buffers / build-out resistors -->
  <rect x="20" y="110" width="140" height="48" class="p"/>
  <text x="34" y="138" class="t">Buffer + R25..R27</text>

  <!-- Output coupling caps -->
  <rect x="200" y="110" width="160" height="48" class="p"/>
  <text x="212" y="138" class="t">C13/C14/C15 (DC block)</text>

  <!-- Outputs -->
  <rect x="420" y="110" width="160" height="48" class="p"/>
  <text x="436" y="138" class="t">J3/J4/J5 Outputs</text>

  <!-- Connections -->
  <line x1="140" y1="54" x2="180" y2="44" class="c" />
  <line x1="300" y1="44" x2="320" y2="44" class="c" />
  <line x1="440" y1="44" x2="460" y2="44" class="c" />
  <line x1="100" y1="134" x2="200" y2="134" class="c" />
  <line x1="360" y1="134" x2="420" y2="134" class="c" />

  <text x="20" y="180" class="t">Notes:</text>
  <text x="20" y="198" class="t">- VRs are wired as rheostats where applicable (dual-gang pots)</text>
  <text x="20" y="214" class="t">- R25..R27 are output build-out resistors; C13..C15 DC-block outputs to terminal blocks</text>
</svg>
